name: APK Android

on:
  push:
    branches: [main]
    paths: ['index.html', 'version.json', 'assets/**', 'android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Copier le jeu dans l'appli
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html version.json manifest.webmanifest android/app/src/main/assets/www/
          cp -r assets android/app/src/main/assets/www/
          echo "GAME_VERSION=$(python3 -c "import json;print(json.load(open('version.json'))['v'])")" >> $GITHUB_ENV
      - name: Construire l'APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Publier l'APK (release « apk »)
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Velocite.apk
          gh release delete apk -y --cleanup-tag || true
          gh release create apk Velocite.apk --title "Vélocité Android $GAME_VERSION" --notes "APK Android de Vélocité $GAME_VERSION. Télécharge Velocite.apk sur ton téléphone et autorise l'installation depuis cette source." --latest
      - uses: actions/upload-artifact@v4
        with: { name: Velocite-apk, path: Velocite.apk }
